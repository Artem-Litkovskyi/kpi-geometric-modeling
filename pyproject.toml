[project]
name = "kpi-geometric-modeling"
version = "0.1.0"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "tmm-kit @ git+https://github.com/Artem-Litkovskyi/tmm-kit.git",
]

[dependency-groups]
dev = [
    "scipy-stubs==1.18.1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Enable standard Pyflakes (F), pycodestyle (E, W), isort (I),
# pyupgrade (UP), and pydocstyle (D)
select = ["F", "E", "W", "I", "UP", "D"]
ignore = ["F403", "F405", "E731", "UP040", "D100", "D104"]

[tool.ruff.lint.isort]
# Forces standard library, then third-party, then first-party local imports
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
# Enforce Sphinx-style docstrings for all modules, classes, and functions
convention = "numpy"

[tool.ruff.format]
# Ruff formatter defaults to double quotes, trailing commas, and standard blank lines
quote-style = "double"